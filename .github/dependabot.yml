# Dependabot : mises à jour de dépendances et alertes de sécurité.
version: 2
updates:
  # Paquets npm (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Correctifs et mineures regroupés ; les majeures d'Angular restent séparées
      # (elles se migrent avec `ng update`, une version majeure à la fois)
      npm-minor-and-patch:
        update-types: ["minor", "patch"]
    # Angular 16 est épinglé : ces paquets se migrent ensemble avec `ng update`, une majeure à la fois.
    # Une PR isolée (ex. @angular/compiler 22 avec un cœur en 16) casse `npm ci` et le build.
    ignore:
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@angular-devkit/*"
        update-types: ["version-update:semver-major"]
      # Versions 0.x : une mineure peut être incompatible (Angular 16 attend zone.js ~0.13 ou ~0.14)
      - dependency-name: "zone.js"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Angular 16 exige TypeScript 5.1.x
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Images Docker du Dockerfile (node, nginx)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Node : Angular 16 ne tourne que sur Node 16 ou 18 ; à revoir avec la migration Angular
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Images Docker du docker-compose.yml (postgres)
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # PostgreSQL : un volume créé en 16 ne démarre pas en 18 (migration pg_upgrade/dump nécessaire)
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
