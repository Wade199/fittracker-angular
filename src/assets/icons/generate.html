<!DOCTYPE html>
<html>
<head><title>Générateur icônes FitTracker</title></head>
<body>
<h2>Génération des icônes PWA FitTracker</h2>
<p>Ouvre ce fichier dans un navigateur, puis clique sur chaque bouton pour télécharger les icônes.</p>
<div id="canvases"></div>
<script>
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const s = size, cx = s/2, cy = s/2;
  const u = s / 100;

  // Fond noir
  const r = s * 0.12;
  ctx.beginPath();
  ctx.moveTo(r,0); ctx.lineTo(s-r,0); ctx.quadraticCurveTo(s,0,s,r);
  ctx.lineTo(s,s-r); ctx.quadraticCurveTo(s,s,s-r,s);
  ctx.lineTo(r,s); ctx.quadraticCurveTo(0,s,0,s-r);
  ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
  ctx.closePath();
  ctx.fillStyle = '#080808'; ctx.fill();

  // Cercle jaune
  ctx.beginPath();
  ctx.arc(cx, cy, s*0.38, 0, Math.PI*2);
  ctx.fillStyle = '#f5c518'; ctx.fill();

  // Silhouette
  ctx.fillStyle = '#080808';
  // Barre
  ctx.fillRect(s*0.2, s*0.22, s*0.6, u*4);
  // Tête
  ctx.beginPath(); ctx.arc(cx, s*0.35, u*6, 0, Math.PI*2); ctx.fill();
  // Corps
  ctx.fillRect(cx-u*5, s*0.42, u*10, u*14);
  // Bras G
  ctx.save(); ctx.translate(cx-u*8, s*0.28); ctx.rotate(-0.3);
  ctx.fillRect(-u*2, 0, u*4, u*16); ctx.restore();
  // Bras D
  ctx.save(); ctx.translate(cx+u*8, s*0.28); ctx.rotate(0.3);
  ctx.fillRect(-u*2, 0, u*4, u*16); ctx.restore();
  // Jambe G
  ctx.save(); ctx.translate(cx-u*3, s*0.56); ctx.rotate(0.15);
  ctx.fillRect(-u*2, 0, u*4, u*14); ctx.restore();
  // Jambe D
  ctx.save(); ctx.translate(cx+u*3, s*0.56); ctx.rotate(-0.15);
  ctx.fillRect(-u*2, 0, u*4, u*14); ctx.restore();

  // Texte FT
  if (size >= 96) {
    ctx.fillStyle = '#f5c518';
    ctx.font = `900 ${u*12}px Arial Black`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FT', cx, s*0.88);
  }

  // Bouton téléchargement
  const btn = document.createElement('a');
  btn.download = `icon-${size}x${size}.png`;
  btn.href = canvas.toDataURL('image/png');
  btn.textContent = `⬇ Télécharger icon-${size}x${size}.png`;
  btn.style.cssText = 'display:block;margin:8px;padding:8px 16px;background:#f5c518;color:#000;font-weight:bold;border-radius:6px;text-decoration:none;width:fit-content';

  document.getElementById('canvases').appendChild(canvas);
  document.getElementById('canvases').appendChild(btn);
  canvas.style.cssText = 'margin:8px;border:1px solid #ccc';
});
</script>
</body>
</html>
