<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fond noir -->
  <rect width="512" height="512" rx="100" fill="#080808"/>
  <!-- Cercle jaune -->
  <circle cx="256" cy="256" r="200" fill="#f5c518"/>
  <!-- Silhouette athlète en traction -->
  <g fill="#080808">
    <!-- Barre -->
    <rect x="100" y="130" width="312" height="22" rx="11"/>
    <!-- Tête -->
    <circle cx="256" cy="195" r="32"/>
    <!-- Corps -->
    <rect x="232" y="228" width="48" height="70" rx="12"/>
    <!-- Bras gauche -->
    <rect x="148" y="152" width="18" height="90" rx="9" transform="rotate(-18 157 197)"/>
    <!-- Bras droit -->
    <rect x="346" y="152" width="18" height="90" rx="9" transform="rotate(18 355 197)"/>
    <!-- Jambe gauche -->
    <rect x="238" y="296" width="18" height="80" rx="9" transform="rotate(12 247 336)"/>
    <!-- Jambe droite -->
    <rect x="256" y="296" width="18" height="80" rx="9" transform="rotate(-12 265 336)"/>
  </g>
  <!-- Texte FT -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial Black, sans-serif"
        font-size="52" font-weight="900" fill="#080808" letter-spacing="4">FT</text>
</svg>
