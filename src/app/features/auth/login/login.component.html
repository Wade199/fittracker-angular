<div class="auth-page">

  <!-- ── Panneau gauche — image pure, rien d'autre ── -->
  <div class="auth-visual"></div>

  <!-- ── Panneau droit — formulaire ── -->
  <div class="auth-form-panel">
    <div class="auth-card">

      <div class="auth-logo">
        <div class="logo-icon-wrap">
          <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" width="44" height="44">
            <circle cx="20" cy="20" r="19" fill="#f5c518"/>
            <circle cx="20" cy="13" r="5" fill="#080808"/>
            <rect x="15" y="20" width="10" height="12" rx="3" fill="#080808"/>
            <rect x="8" y="22" width="6" height="8" rx="3" fill="#080808"/>
            <rect x="26" y="22" width="6" height="8" rx="3" fill="#080808"/>
          </svg>
        </div>
        <h1>FitTracker</h1>
        <p>Connectez-vous à votre compte</p>
      </div>

      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            [(ngModel)]="credentials.email"
            name="email"
            placeholder="votre@email.com"
            required
            class="form-control"
          />
        </div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <div class="input-with-icon">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              [(ngModel)]="credentials.password"
              name="password"
              placeholder="••••••••"
              required
              class="form-control"
            />
            <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
              {{ showPassword ? '🙈' : '👁️' }}
            </button>
          </div>
        </div>

        <div class="error-message" *ngIf="errorMessage">
          ⚠️ {{ errorMessage }}
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading">
          <span *ngIf="!isLoading">Se connecter</span>
          <span *ngIf="isLoading">Connexion...</span>
        </button>
      </form>

      <p class="auth-link">
        Pas encore de compte ?
        <a routerLink="/register">Créer un compte</a>
      </p>

    </div>
  </div>
</div>
