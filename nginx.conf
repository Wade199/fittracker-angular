server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ── DNS resolver Docker interne ──────────────
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ── Compression ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml application/font-woff2;
    gzip_min_length 1000;

    # ── Headers de sécurité ───────────────────────
    # Empêche le clickjacking
    add_header X-Frame-Options "DENY" always;
    # Empêche le MIME sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # Active la protection XSS du navigateur
    add_header X-XSS-Protection "1; mode=block" always;
    # Contrôle les infos de référence
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions des fonctionnalités navigateur
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content Security Policy — autorise uniquement les ressources de l'app
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' http://localhost:8080 http://localhost:8081; frame-ancestors 'none';" always;
    # HSTS — force HTTPS (activer seulement si HTTPS est configuré)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Proxy API → Backend ───────────────────────
    location /api/ {
        set $backend_url "http://fittracker-backend:8080";
        proxy_pass $backend_url/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        # Masque la version du backend
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
    }

    # ── Cache assets statiques ────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Service Worker — pas de cache
    location /ngsw-worker.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Manifest PWA
    location /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache";
    }

    # ── SPA Angular ───────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # ── Masque la version Nginx ───────────────────
    server_tokens off;
}
