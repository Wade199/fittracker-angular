# =============================================
# DOCKER COMPOSE — FitTracker
# Services : frontend + backend + database
# =============================================

services:

  # ── Base de données PostgreSQL ──────────────
  db:
    image: postgres:18-alpine
    container_name: fittracker-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: streetworkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant, copier .env.example en .env et le remplir}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streetworkout"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fittracker-network

  # ── Backend Spring Boot ─────────────────────
  backend:
    build:
      context: ../streetworkout-backend
      dockerfile: Dockerfile
    container_name: fittracker-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/streetworkout
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD manquant}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant, copier .env.example en .env et le remplir}
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200,http://localhost:3000,http://frontend,http://127.0.0.1
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fittracker-network

  # ── Frontend Angular ────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fittracker-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fittracker-network

# ── Volumes persistants ─────────────────────
volumes:
  postgres_data:
    driver: local

# ── Réseau interne ──────────────────────────
networks:
  fittracker-network:
    driver: bridge
